# Reads the latest EAS builds and submissions (status and errors). Run on demand.
name: EAS status
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read
        run: |
          mkdir -p /tmp/o
          npx --yes eas-cli@latest build:list --platform ios --limit 3 --non-interactive > /tmp/o/builds.txt 2>&1 || true
          npx --yes eas-cli@latest submission:list --platform ios --limit 3 --non-interactive > /tmp/o/submissions.txt 2>&1 || npx --yes eas-cli@latest build:view --json > /tmp/o/submissions.txt 2>&1 || true
      - name: Save
        if: always()
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git checkout -q --orphan eas-status
          git rm -rfq --cached . > /dev/null
          rm -rf ./* .gitignore .github 2>/dev/null || true
          cp /tmp/o/* .
          git add -f .
          git commit -qm "EAS status"
          git push -qf origin eas-status
