name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and bundle
        run: bash ci/build.sh
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Save results to ci-output branch
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mv out /tmp/out
          git checkout --orphan ci-output
          git rm -rfq --cached . > /dev/null
          rm -rf ./* .gitignore 2>/dev/null || true
          cp -r /tmp/out ./out
          git add -f out
          git commit -qm "Build output for ${GITHUB_SHA}"
          git push -f origin ci-output
