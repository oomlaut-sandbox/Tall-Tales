name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        run: |
          mkdir -p ci
          echo "Build ran at $(date -u) for ${GITHUB_SHA}" > ci/status.txt
      - name: Save results to ci-output branch
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan ci-output
          git rm -rfq --cached . >/dev/null
          git add -f ci
          git commit -qm "Build output for ${GITHUB_SHA}"
          git push -f origin ci-output
