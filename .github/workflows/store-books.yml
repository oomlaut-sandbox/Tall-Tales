# Looks at (and, when asked, tidies) the Book Store's rows in Supabase, through the Management API.
# input "sql": optional SQL to run first (e.g. take an old built-in book's row out). Then it reports every row.
# Needs the SUPABASE_ACCESS_TOKEN and SUPABASE_URL secrets. Never prints keys.
name: Store books
on:
  workflow_dispatch:
    inputs:
      sql:
        description: SQL to run first (leave empty to only report)
        required: false
        default: ''
permissions:
  contents: write
jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SQL: ${{ inputs.sql }}
        run: |
          node -e '
            const ref = (process.env.SUPABASE_URL || "").trim().replace(/^https:\/\/([a-z0-9]+)\.supabase\.co\/?$/, "$1");
            const q = (query) => fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
              method: "POST", headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify({ query }) }).then(async (r) => r.status + " " + (await r.text()));
            (async () => {
              const out = [];
              if ((process.env.SQL || "").trim()) out.push("ran: " + await q(process.env.SQL));
              out.push("books: " + await q("select id, title, author, bundled, published, access, shelf_id, min_age, source_story, updated_at from public.books order by bundled desc, title"));
              require("fs").writeFileSync("/tmp/r.txt", out.join("\n") + "\n"); console.log(out.join("\n"));
            })();'
      - name: Save report
        if: always()
        run: |
          mkdir -p o && cd o && git init -q && cp /tmp/r.txt store-books.txt 2>/dev/null || echo "no report" > store-books.txt
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add store-books.txt && git commit -qm "Store books report"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:store-books-output
