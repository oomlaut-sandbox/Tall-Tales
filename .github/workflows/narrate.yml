# Makes ElevenLabs narration for the built-in books and commits it to main.
# Run from GitHub (Actions → Narration → Run workflow) or by a commit containing [narrate].
name: Narration
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: narration
jobs:
  narrate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[narrate]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node ci/narrate.js
      - name: Save narration to main
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add assets/narration src/narration
          if git diff --cached --quiet; then echo "no new audio"; else git commit -qm "Narration audio (ElevenLabs)"; git pull -q --rebase origin main && git push -q origin HEAD:main; fi
      - name: Save report
        if: always()
        run: |
          cp ios-out/narration.txt /tmp/narration.txt 2>/dev/null || echo "no report" > /tmp/narration.txt
          git fetch -q origin
          git checkout -q --orphan narration-output
          git rm -rfq --cached . > /dev/null
          rm -rf ./* .gitignore 2>/dev/null || true
          cp /tmp/narration.txt narration.txt
          git add -f narration.txt
          git commit -qm "Narration report"
          git push -qf origin narration-output
