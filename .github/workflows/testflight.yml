# Builds the iPhone app on Expo and sends it to TestFlight.
# Runs when a commit message on main contains [testflight].
name: TestFlight
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ios:
    if: contains(github.event.head_commit.message, '[testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-api-key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Apple key and submit settings
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ios-out
          {
            echo "secret EXPO_TOKEN: $([ -n "$EXPO_TOKEN" ] && echo set || echo MISSING)"
            echo "secret ASC_API_KEY_P8: $([ -n "$ASC_API_KEY_P8" ] && echo set || echo MISSING)"
            echo "secret ASC_KEY_ID: $([ -n "$EXPO_ASC_KEY_ID" ] && echo set || echo MISSING)"
            echo "secret ASC_ISSUER_ID: $([ -n "$EXPO_ASC_ISSUER_ID" ] && echo set || echo MISSING)"
            echo "secret APPLE_TEAM_ID: $([ -n "$EXPO_APPLE_TEAM_ID" ] && echo set || echo MISSING)"
          } > ios-out/checks.txt
          printf '%s\n' "$ASC_API_KEY_P8" > asc-api-key.p8
          APP_ID="${ASC_APP_ID:-$(cat ci/asc-app-id.txt 2>/dev/null)}"
          node -e '
            const fs=require("fs"); const j=JSON.parse(fs.readFileSync("eas.json","utf8"));
            const s=j.submit.production.ios; s.ascAppId=process.argv[1]; s.ascApiKeyId=process.env.EXPO_ASC_KEY_ID; s.ascApiKeyIssuerId=process.env.EXPO_ASC_ISSUER_ID;
            fs.writeFileSync("eas.json", JSON.stringify(j,null,2));' "$APP_ID"
          echo "app id: ${APP_ID:-MISSING}" >> ios-out/checks.txt
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build on Expo and send to TestFlight
        timeout-minutes: 25
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          # The first iOS build has to create the signing certificate and profile, which Expo
          # only does in interactive mode. expect answers each prompt with its default (Enter)
          # and writes everything it sees to ios-out/raw.txt as it happens.
          # --no-wait hands the build to Expo and returns; Expo then sends it to TestFlight itself.
          sudo apt-get install -y -qq expect > /dev/null
          cat > /tmp/build.exp <<'EOF'
          log_file -a ios-out/raw.txt
          set timeout 600
          spawn env -u CI -u GITHUB_ACTIONS -u CONTINUOUS_INTEGRATION npx --yes eas-cli@latest build --platform ios --profile production --auto-submit --no-wait
          set n 0
          expect {
            -re {›|\(Y/n\)|\(y/N\)} { incr n; if {$n > 40} {send_log "\nGAVE UP after 40 answers\n"; exit 3}; sleep 2; send "\r"; exp_continue }
            timeout { send_log "\nTIMEOUT: no output for 10 minutes\n"; exit 4 }
            eof
          }
          catch wait r
          exit [lindex $r 3]
          EOF
          set +e
          expect /tmp/build.exp > /dev/null 2>&1
          code=$?
          sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' ios-out/raw.txt | tr '\r' '\n' | grep -v '^\s*$' | grep -v 'npm warn' > ios-out/build.txt
          echo "exit $code" >> ios-out/build.txt
          exit $code
      - name: Save results to ios-output branch
        if: always()
        run: |
          rm -f asc-api-key.p8
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          echo "commit ${GITHUB_SHA} at $(date -u)" >> ios-out/checks.txt
          mv ios-out /tmp/ios-out
          git checkout --orphan ios-output
          git rm -rfq --cached . > /dev/null
          rm -rf ./* .gitignore 2>/dev/null || true
          cp -r /tmp/ios-out ./ios-out
          git add -f ios-out
          git commit -qm "TestFlight run for ${GITHUB_SHA}"
          git push -f origin ios-output
